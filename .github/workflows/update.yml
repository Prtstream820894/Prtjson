name: Auto Split Playlist

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Agar chahe toh har kuch ghante mein automatically update ke liye schedule bhi laga sakta hai
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download latest master playlist
        run: |
          curl -L "https://raw.githubusercontent.com/Prtstream820894/Prmovies/refs/heads/main/playlist.m3u" -o playlist.m3u

      - name: Run splitting script
        run: python split_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/ playlists.json playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update split playlists and json" && git push)
          
